<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Profil — CDS Markaz</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        // Dark mode flash oldini olish — darhol ishga tushadi
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        /* style.css'dagi o'zgaruvchilarga to'liq bog'langan — sinxron tema */
        .pf-body {
            min-height: 100vh;
            height: auto;
            overflow: auto;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
        }

        /* ─── TOPBAR ─────────────────────────────── */
        .pf-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            height: 58px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }
        .pf-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text2);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color .15s;
        }
        .pf-back:hover { color: var(--text); }
        .pf-theme-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px; height: 34px;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            background: var(--surface2);
            color: var(--muted);
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }
        .pf-theme-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--accent); }

        /* ─── STAGE / CARD ───────────────────────── */
        .pf-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .pf-card {
            width: 100%;
            max-width: 820px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            overflow: hidden;
            display: grid;
            grid-template-columns: 300px 1fr;
            box-shadow: 0 24px 60px -20px rgba(0,0,0,.25);
        }

        /* ─── LEFT — identity ────────────────────── */
        .pf-side {
            position: relative;
            padding: 40px 30px;
            background: linear-gradient(135deg, #6366f1 0%, #7c5cf6 55%, #9333ea 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .pf-side::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                    radial-gradient(circle at 80% 10%, rgba(255,255,255,.18), transparent 45%),
                    radial-gradient(circle at 10% 90%, rgba(0,0,0,.22), transparent 50%);
            pointer-events: none;
        }
        .pf-side-content { position: relative; z-index: 1; }
        .pf-avatar {
            width: 84px; height: 84px;
            border-radius: 24px;
            background: rgba(255,255,255,.16);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 34px; font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }
        .pf-side h1 {
            font-size: 21px; font-weight: 700;
            margin: 0 0 4px; line-height: 1.25;
            letter-spacing: -0.02em;
        }
        .pf-handle { font-size: 14px; opacity: .82; margin: 0; }
        .pf-side-meta { position: relative; z-index: 1; margin-top: auto; padding-top: 28px; }
        .pf-role {
            display: inline-block;
            font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: .8px;
            padding: 6px 12px; border-radius: 999px;
            background: rgba(255,255,255,.18);
            border: 1px solid rgba(255,255,255,.25);
        }

        /* ─── RIGHT — form ───────────────────────── */
        .pf-form { padding: 38px 40px; }
        .pf-form-title { font-size: 17px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
        .pf-form-sub { font-size: 13px; color: var(--muted); margin: 0 0 26px; }
        .pf-field { margin-bottom: 18px; }
        .pf-field label {
            display: block; font-size: 11.5px; font-weight: 600;
            color: var(--muted); margin-bottom: 7px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .pf-input-wrap { position: relative; }
        .pf-input-wrap > svg {
            position: absolute; left: 13px; top: 50%;
            transform: translateY(-50%);
            color: var(--muted); pointer-events: none;
        }
        .pf-field input {
            width: 100%;
            padding: 11px 44px 11px 40px;
            border: 1px solid var(--border2);
            border-radius: var(--r-md);
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        /* O'ngda copy tugmasi bo'lmagan inputlar uchun normal padding */
        .pf-field input.no-copy { padding-right: 14px; }

        /* ─── COPY BUTTON (profile) ──────────────── */
        .pf-copy-btn {
            position: absolute;
            right: 7px; top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center; justify-content: center;
            width: 28px; height: 28px;
            border: none;
            border-radius: var(--r-sm);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: background .15s, color .15s;
        }
        .pf-copy-btn:hover { background: var(--surface3); color: var(--text); }
        .pf-copy-btn.copied { color: var(--green); }
        .pf-field input::placeholder { color: var(--muted); }
        .pf-field input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
            background: var(--surface);
        }
        .pf-field input:disabled { opacity: .55; cursor: not-allowed; }
        .pf-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
        .pf-divider { height: 1px; background: var(--border); margin: 24px 0 20px; }

        /* ─── ACTIONS ────────────────────────────── */
        .pf-actions { display: flex; gap: 10px; margin-top: 26px; }
        .pf-btn-save {
            flex: 1; padding: 13px;
            border: none; border-radius: var(--r-md);
            background: var(--accent);
            color: #fff; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: background .15s, transform .12s, box-shadow .15s;
        }
        .pf-btn-save:hover { background: #4f51d8; transform: translateY(-1px); box-shadow: 0 8px 22px -6px rgba(99,102,241,.5); }
        .pf-btn-save:active { transform: translateY(0); }
        .pf-btn-cancel {
            padding: 13px 22px;
            border: 1px solid var(--border2);
            border-radius: var(--r-md);
            background: transparent;
            color: var(--text2); font-size: 14px; font-weight: 500;
            cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center;
            transition: background .15s, color .15s;
        }
        .pf-btn-cancel:hover { background: var(--surface2); color: var(--text); }

        /* Native inputlar tema bo'yicha */
        html.dark .pf-field input { color-scheme: dark; }
        html:not(.dark) .pf-field input { color-scheme: light; }

        /* ─── RESPONSIVE ─────────────────────────── */
        @media (max-width: 720px) {
            .pf-card { grid-template-columns: 1fr; max-width: 460px; }
            .pf-side { flex-direction: row; align-items: center; gap: 18px; padding: 26px 28px; }
            .pf-avatar { margin-bottom: 0; width: 64px; height: 64px; font-size: 26px; border-radius: 18px; }
            .pf-side-meta { display: none; }
            .pf-form { padding: 28px 26px; }
        }
    </style>
</head>
<body class="pf-body">

<div class="pf-topbar">
    <a href="/admin-page" class="pf-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Dashboard
    </a>
    <button class="pf-theme-btn" onclick="toggleTheme()" title="Tema">
        <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
    </button>
</div>

<div class="pf-stage">
    <div class="pf-card">

        <!-- LEFT — identity -->
        <div class="pf-side">
            <div class="pf-side-content">
                <div class="pf-avatar" th:text="${user.getInitials()}">AD</div>
                <h1 th:text="${user.fullName}">Admin</h1>
                <p class="pf-handle" th:text="'@' + ${user.telegramUsername}">@admin</p>
            </div>
            <div class="pf-side-meta">
                <span class="pf-role" th:text="${role != null ? role.name : 'Administrator'}">Super Admin</span>
            </div>
        </div>

        <!-- RIGHT — form -->
        <div class="pf-form">
            <h2 class="pf-form-title">Profilni tahrirlash</h2>
            <p class="pf-form-sub">Shaxsiy ma'lumotlaringizni yangilang.</p>

            <form method="post" action="/profile/update" id="profileForm">

                <div class="pf-field">
                    <label for="fullName">To'liq ism</label>
                    <div class="pf-input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="fullName" name="fullName" th:value="${user.fullName}" required/>
                        <button type="button" class="pf-copy-btn" onclick="copyInput('fullName', this)" title="Nusxa olish">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2"/>
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="pf-field">
                    <label for="phoneNumber">Telefon raqami</label>
                    <div class="pf-input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/>
                        </svg>
                        <input type="text" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}" placeholder="998 90 123 45 67" required/>
                        <button type="button" class="pf-copy-btn" onclick="copyInput('phoneNumber', this)" title="Nusxa olish">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2"/>
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="pf-field">
                    <label for="password">Yangi parol</label>
                    <div class="pf-input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" class="no-copy" placeholder="O'zgartirmasangiz bo'sh qoldiring"/>
                    </div>
                    <div class="pf-hint">Parolni o'zgartirmoqchi bo'lsangizgina to'ldiring.</div>
                </div>

                <div class="pf-divider"></div>

                <div class="pf-field">
                    <label>Telegram username</label>
                    <div class="pf-input-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                        <input type="text" id="tgUsername" th:value="${user.telegramUsername}" disabled/>
                        <button type="button" class="pf-copy-btn" onclick="copyInput('tgUsername', this)" title="Nusxa olish">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2"/>
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                            </svg>
                        </button>
                    </div>
                    <div class="pf-hint">Username o'zgartirib bo'lmaydi.</div>
                </div>

                <div class="pf-actions">
                    <a href="/admin-page" class="pf-btn-cancel">Bekor</a>
                    <button type="submit" class="pf-btn-save">Saqlash</button>
                </div>
            </form>
        </div>

    </div>
</div>

<script>
    function applyThemeIcon() {
        const isDark = document.documentElement.classList.contains('dark');
        const moon = document.getElementById('iconMoon');
        const sun  = document.getElementById('iconSun');
        if (moon && sun) {
            moon.style.display = isDark ? 'none' : 'block';
            sun.style.display  = isDark ? 'block' : 'none';
        }
    }
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        applyThemeIcon();
    }
    applyThemeIcon();

    document.getElementById('profileForm').addEventListener('submit', function() {
        const pw = document.getElementById('password');
        if (!pw.value.trim()) pw.removeAttribute('name');
    });

    // ─── CLIPBOARD ────────────────────────────────────────────
    function copyInput(inputId, btn) {
        const el = document.getElementById(inputId);
        const text = (el.value || '').trim();
        if (!text) return;

        navigator.clipboard.writeText(text).then(() => {
            btn.classList.add('copied');
            const original = btn.innerHTML;
            btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = original;
            }, 1400);
        }).catch(() => alert('❌ Nusxa olib bo\'lmadi'));
    }
</script>
</body>
</html>
