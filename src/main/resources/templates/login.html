<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tizimga kirish — CDS Markaz</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        // Dark mode flash oldini olish
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style>
        .lg-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
            overflow: auto;
        }

        /* Tema tugmasi — yuqori o'ng burchak */
        .lg-theme-btn {
            position: fixed;
            top: 20px; right: 20px;
            display: inline-flex;
            align-items: center; justify-content: center;
            width: 38px; height: 38px;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            background: var(--surface2);
            color: var(--muted);
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
            z-index: 10;
        }
        .lg-theme-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--accent); }

        .lg-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            box-shadow: 0 24px 60px -20px rgba(0,0,0,0.25);
        }

        .lg-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2rem;
        }
        .lg-logo {
            width: 42px; height: 42px;
            border-radius: var(--r-md);
            background: linear-gradient(135deg, #6366f1, #9333ea);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff; font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 8px 20px -6px rgba(99,102,241,0.5);
        }
        .lg-card-header h1 { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
        .lg-card-header p  { font-size: 12px; color: var(--muted); }

        .lg-alert {
            padding: 10px 14px;
            border-radius: var(--r-md);
            font-size: 13px;
            margin-bottom: 1.2rem;
            display: none;
        }
        .lg-alert.error   { background: var(--red-bg);   color: var(--red);   border: 1px solid var(--red-bg);   display: block; }
        .lg-alert.success { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bg); display: block; }

        .lg-field { margin-bottom: 1rem; }
        .lg-field label {
            display: block;
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .lg-field input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            background: var(--bg);
            border: 1px solid var(--border2);
            border-radius: var(--r-md);
            color: var(--text);
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .lg-field input::placeholder { color: var(--muted); }
        .lg-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }
        .lg-field input.invalid { border-color: var(--red); }

        .lg-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.4rem;
            font-size: 13px;
            color: var(--text2);
            cursor: pointer;
        }
        .lg-remember input[type="checkbox"] { accent-color: var(--accent); }

        .lg-btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            font-family: 'Inter', sans-serif;
            transition: background 0.15s, box-shadow 0.2s, transform 0.1s;
        }
        .lg-btn:hover   { background: #4f51d8; box-shadow: 0 6px 20px -4px rgba(99,102,241,0.5); }
        .lg-btn:active  { transform: scale(0.98); }
        .lg-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        html.dark .lg-field input { color-scheme: dark; }
        html:not(.dark) .lg-field input { color-scheme: light; }
    </style>
</head>
<body class="lg-body">

<button class="lg-theme-btn" onclick="toggleTheme()" title="Tema">
    <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
    </svg>
    <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
</button>

<div class="lg-card">

    <div class="lg-card-header">
        <img class="lg-logo-img" th:src="@{/images/cds-logo.png}" alt="CDS"/>
        <div>
            <h1>Tizimga kirish</h1>
            <p>CDS Markaz · Admin Panel</p>
        </div>
    </div>

    <div id="alert" class="lg-alert"></div>

    <form id="loginForm" action="/login-check" method="POST">

        <div class="lg-field">
            <label for="username">Foydalanuvchi nomi</label>
            <input type="text" id="username" name="username"
                   placeholder="username" autocomplete="username" />
        </div>

        <div class="lg-field">
            <label for="password">Parol</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" autocomplete="current-password" />
        </div>

        <label class="lg-remember">
            <input type="checkbox" name="remember" /> Meni eslab qol
        </label>

        <button type="submit" class="lg-btn" id="submitBtn">Kirish</button>

    </form>
</div>

<script>
    function applyThemeIcon() {
        const isDark = document.documentElement.classList.contains('dark');
        const moon = document.getElementById('iconMoon');
        const sun  = document.getElementById('iconSun');
        if (moon && sun) {
            moon.style.display = isDark ? 'none' : 'block';
            sun.style.display  = isDark ? 'block' : 'none';
        }
    }
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        applyThemeIcon();
    }
    applyThemeIcon();

    const params = new URLSearchParams(location.search);
    if (params.get('error') === 'user') {
        showAlert('error', 'Bunday foydalanuvchi topilmadi.');
    } else if (params.get('error') === 'pass') {
        showAlert('error', 'Parol noto\'g\'ri.');
    }

    function showAlert(type, text) {
        const el = document.getElementById('alert');
        el.className = 'lg-alert ' + type;
        el.textContent = text;
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const btn      = document.getElementById('submitBtn');

        username.classList.remove('invalid');
        password.classList.remove('invalid');
        document.getElementById('alert').className = 'lg-alert';

        let valid = true;
        if (!username.value.trim()) { username.classList.add('invalid'); valid = false; }
        if (!password.value)        { password.classList.add('invalid'); valid = false; }

        if (!valid) {
            e.preventDefault();
            showAlert('error', 'Iltimos, barcha maydonlarni to\'ldiring.');
            return;
        }

        btn.disabled    = true;
        btn.textContent = 'Tekshirilmoqda...';
    });
</script>

</body>
</html>
